name: release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: read
  id-token: write # OIDC for npm Trusted Publishing

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    env:
      HUSKY: "0" # disable git hooks in CI
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          registry-url: "https://registry.npmjs.org"

      - name: Setup Bun 1.3.0
        uses: oven-sh/setup-bun@v1
        with:
          bun-version: "1.3.0"

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.22.x"

      - name: Derive version from tag
        id: v
        shell: bash
        run: echo "VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Install deps
        run: bun install

      - name: Build MCP servers
        run: bun run -C packages/hpcgpt build

      - name: Build platform dist
        run: |
          HPCGPT_VERSION=${{ steps.v.outputs.VERSION }} bun run -C packages/hpcgpt build:dist
          ls -la packages/hpcgpt/dist

      - name: Publish platform packages (OIDC)
        shell: bash
        run: |
          set -euo pipefail
          for d in packages/hpcgpt/dist/hpcgpt-*; do
            echo "Publishing $d"
            (cd "$d" && npm publish --provenance --access public)
          done

      - name: Publish meta package (OIDC)
        working-directory: packages/hpcgpt
        run: npm publish --provenance --access public


